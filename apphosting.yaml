# Firebase App Hosting build/runtime config.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: APP_URL
    value: https://REPLACE-WITH-YOUR-APP-HOSTING-URL
    availability:
      - BUILD
      - RUNTIME

  # Public Firebase web config (Project settings → General → Your apps → Web app).
  # These identify the project to the browser; they are not secrets.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBxzA_jU93aBbSOdbSqBgutVhbqBp9xSIw"
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: fir-wellness-f833d.firebaseapp.com
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: fir-wellness-f833d
    availability: [BUILD]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:173107512243:web:79c004953e0f0b2db281c6"
    availability: [BUILD]

  # SMTP: a real transactional email provider (e.g. Resend, Brevo) in production.
  # Mailpit is dev-only.
  - variable: SMTP_HOST
    value: smtp.example.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  - variable: MAIL_FROM
    value: "Daily Check-In <checkin@REPLACE-WITH-YOUR-VERIFIED-DOMAIN>"
    availability:
      - RUNTIME

  # Gemini on Vertex AI, authenticated as the App Hosting service account (no key).
  # Needs the Vertex AI API enabled and roles/aiplatform.user; see README.
  - variable: GOOGLE_CLOUD_PROJECT
    value: fir-wellness-f833d
    availability:
      - RUNTIME

  # Secrets live in Cloud Secret Manager. Create each once with:
  #   firebase apphosting:secrets:set <NAME>
  - variable: SMTP_USER
    secret: SMTP_USER
  - variable: SMTP_PASS
    secret: SMTP_PASS
  # Shared with the Cloud Scheduler job that calls /api/cron/morning.
  - variable: CRON_SECRET
    secret: CRON_SECRET
